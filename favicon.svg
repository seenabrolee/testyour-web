<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1418" />
      <stop offset="50%" stop-color="#131722" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d40" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="18" flood-color="#ff3b30" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="#ff3b30" stroke-width="22" filter="url(#redGlow)" />
  
  <!-- Subtle inner neon ring -->
  <rect x="46" y="46" width="420" height="420" rx="96" fill="none" stroke="rgba(255, 59, 48, 0.35)" stroke-width="6" />

  <!-- Bold Modern Geometric 'T' -->
  <!-- Top Bar -->
  <path d="M110 136 C110 125 119 116 130 116 H382 C393 116 402 125 402 136 V196 C402 207 393 216 382 216 H306 V382 C306 393 297 402 286 402 H226 C215 402 206 393 206 382 V216 H130 C119 216 110 207 110 196 Z" fill="url(#tGrad)" />

  <!-- Dynamic Red Slash Accent on T (giving gaming / hunter aura flair) -->
