<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리센느(RESCENE) 성향 테스트</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Jua', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f3e5f5 0%, #fce4ec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            flex-grow: 1;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 28px;
            color: #6a1b9a;
            margin-bottom: 30px;
            line-height: 1.4;
            word-break: keep-all;
        }

        p {
            font-size: 18px;
            color: #424242;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #ce93d8;
            color: #fff;
            border: none;
            border-radius: 25px;
            padding: 16px 20px;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            word-break: keep-all;
            line-height: 1.3;
        }

        .btn:hover, .btn:active {
            transform: scale(1.03);
            background-color: #ab47bc;
        }
        
        .btn-start {
            background-color: #ab47bc;
            font-size: 24px;
            padding: 18px 40px;
            margin-top: 20px;
        }
        .btn-start:hover, .btn-start:active {
            background-color: #8e24aa;
        }

        /* Progress Bar */
        .progress-wrapper {
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
        }
        .progress-text {
            font-size: 18px;
            color: #8e24aa;
            margin-bottom: 10px;
        }
        .progress-container {
            width: 100%;
            background-color: #e1bee7;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #8e24aa;
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 6px;
        }

        .question-text {
            font-size: 24px;
            color: #4a148c;
            margin-bottom: 40px;
            word-break: keep-all;
            line-height: 1.4;
        }

        .answers {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Loading */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .loader {
            border: 6px solid #f3e5f5;
            border-top: 6px solid #ab47bc;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 22px;
            color: #6a1b9a;
        }

        /* Result */
        .result-title {
            font-size: 20px;
            color: #8e24aa;
            margin-bottom: 10px;
        }
                .result-image {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .result-name {
            font-size: 42px;
            color: #4a148c;
            margin-bottom: 25px;
        }
        .result-desc {
            font-size: 18px;
            background-color: #f3e5f5;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 40px;
            line-height: 1.6;
            color: #424242;
            word-break: keep-all;
            text-align: left;
            border: 2px solid #e1bee7;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 시작 화면 -->
        <div id="screen-start" class="screen active">
            <img src="/rescene/images/rescene_logo.svg" alt="RESCENE Logo" style="width: 180px; margin-bottom: 20px;">
            <div style="font-size: 16px; color: #ab47bc; letter-spacing: 2px; margin-bottom: 10px;">RE:MINE X RESCENE</div>
            <h1>나와 가장 닮은<br>리센느 멤버는<br>누구일까?</h1>
            <p style="color: #8e24aa; font-size: 18px; margin-top: -10px; margin-bottom: 30px;">(멤버 중 한 명이 선택됩니다... 아마도.)</p>
            <button class="btn btn-start" onclick="startTest()">테스트 시작하기</button>
        </div>

        <!-- 테스트 화면 -->
        <div id="screen-test" class="screen">
            <div class="progress-wrapper">
                <div class="progress-text"><span id="current-q">1</span> / <span id="total-q">0</span></div>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
            <div id="question-text" class="question-text">질문 텍스트</div>
            <div id="answers-container" class="answers">
                <!-- 버튼들이 동적으로 생성됨 -->
            </div>
        </div>

        <!-- 로딩 화면 -->
        <div id="screen-loading" class="screen">
            <div class="loader-container">
                <div class="loader"></div>
                <div class="loading-text">당신의 성향을 분석 중입니다...</div>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="screen-result" class="screen">
            <img id="result-image" class="result-image" src="" alt="결과 이미지" style="display: none;">
            <div id="result-name" class="result-name" style="margin-bottom: 5px;">이름</div>
            <div id="result-title" class="result-title" style="font-size: 24px; color: #8e24aa; margin-bottom: 20px;">타이틀</div>
            
            <!-- 쿠팡 광고 유도 영역 -->
            <a href="https://www.coupang.com" target="_blank" id="ad-container" style="display: block; width: 100%; text-decoration: none; margin: 15px 0 30px 0; padding: 25px 20px; background-color: #fff0f5; border-radius: 15px; border: 2px dashed #f48fb1; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.2s;" onclick="setTimeout(unlockResult, 500)">
                <div style="font-weight: bold; font-size: 18px; color: #d81b60; margin-bottom: 8px;">🎁 쿠팡 로켓배송 특가 보러가기 (광고)</div>
                <div style="font-size: 15px; color: #666; word-break: keep-all;">👆 위 <b>광고를 클릭</b>하시면 잠겨있는<br><span style="color:#ab47bc; font-weight:bold;">'종합 성향 해석'</span>이 즉시 공개됩니다!</div>
            </a>

            <!-- 상세 결과 (초기 숨김) -->
            <div id="detailed-result" style="display: none; width: 100%;">
                <div style="font-size: 20px; font-weight: bold; color: #6a1b9a; margin-bottom: 15px; text-align: left; padding-left: 5px;">📑 종합 성향 해석</div>
                <div id="result-desc" class="result-desc">상세 설명</div>
                
                <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                    <button class="btn" onclick="shareResult()" style="background-color: #4caf50; font-size: 18px; padding: 14px;">🔗 결과 링크 공유하기</button>
                    <button class="btn" onclick="contactUs()" style="background-color: #ff9800; font-size: 18px; padding: 14px;">✉️ 개발자에게 문의하기</button>
                    <button class="btn btn-start" onclick="restartTest()" style="margin-top: 10px;">테스트 다시하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 검색 엔진을 통해 찾은 대표 이미지 URL 추가
        const characters = {
            woni: { name: '원이', title: '파이리', image: '/rescene/images/woni.jpg', description: '수줍음 따위는 모르는 당찬 거제 소녀입니다! 특유의 친화력과 리더십으로 든든하게 팀의 중심을 잡아줍니다. 통통 튀는 매력과 지치지 않는 에너지로 주변 사람들에게 항상 활기를 불어넣으며, 부드러우면서도 단단한 카리스마로 멤버들을 이끄는 리센느의 믿음직한 기둥입니다.' },
            liv: { name: '리브', title: '너도? 아 나도!', image: '/rescene/images/liv.jpg', description: '어디로 튈지 모르는 엉뚱한 매력을 가진 팀 내 공식 개그 캐릭터입니다! 평소에는 밝고 에너제틱하게 웃음을 주지만, 무대 위에만 올라가면 언제 그랬냐는 듯 완벽한 퍼포먼스와 표정 연기로 무대를 찢어놓는 엄청난 갭모에의 소유자입니다. 사랑할 수밖에 없는 인간 비타민이죠.' },
            minami: { name: '미나미', title: '야호', image: '/rescene/images/minami.jpg', description: '감정 표현이 솔직하고 리액션이 크며, 사소한 칭찬이나 이벤트에도 감동을 잘 받는 여린 마음씨를 지녔습니다. 평소에는 장난도 잘 치고 엉뚱한 모습을 보이지만, 본업에 있어서는 자신이 만족할 때까지 파고드는 지독한 노력파입니다.' },
            may: { name: '메이', title: '햇살', image: '/rescene/images/may.jpg', description: '겉보기엔 가장 차분하고 어른스러운 도도파 같지만, 알고 보면 \'꼬맹메이\', \'메찬호\'라는 별명이 있을 정도로 한 번 입이 터지면 귀엽게 재잘거리는 수다쟁이입니다. 무심하게 툭툭 던지는 팩트 폭력이 큰 웃음을 주며, 세심하고 깊은 마음씨로 멤버들을 다정하게 챙기는 반전 매력의 소유자입니다.' },
            zena: { name: '제나', title: '신라공주', image: '/rescene/images/zena.jpg', description: '"세상이 무너져...!"라는 말을 달고 사는, 누가 봐도 영락없는 리센느의 귀여운 막내입니다! 낯선 환경에서는 수줍음을 타며 낯을 가리지만, 편하고 친한 사람들 앞에서는 거침없는 \'방구석 여포\'로 돌변합니다. 솔직하고 사랑스러운 막내 온탑의 정석을 보여주는 멤버입니다.' },
            yoon: { name: '윤성원 PD(피디니무)', title: '리센느를 세상에 알린 안원잘부의 마스터마인드', image: '/rescene/images/yoon.jpg', description: '유튜브 \'안원잘부(안녕하세오 원이 잘 부탁드려오)\'를 기획하고 연출하여 대중들에게 리센느의 매력을 널리 알린 특급 공신입니다! 감정보다는 팩트와 효율을 중시하는 확고한 T(이성적) 성향이지만, 그 이면에는 리센느가 가장 빛날 수 있도록 치밀한 판을 짜고 멤버들을 챙겨주는 따뜻한 애정이 숨어있습니다. 큰 그림을 완벽하게 그려내는 무대 밖의 진정한 주인공, 피디니무입니다.' },
            kku: { name: '꾸대표', title: '리센느의 아낌없이 주는 나무', image: '/rescene/images/kku.jpg', description: '멤버들이 마음껏 뛰어놀 수 있도록 뒤에서 묵묵히 모든 것을 서포트해 주는 든든한 버팀목이자 대표님입니다. 화려하게 나서기보다는 보이지 않는 곳에서 궂은일을 도맡아 하며, 위기 상황에서도 흔들리지 않는 평온함으로 모두에게 안정감을 주는 따뜻한 리더십의 소유자입니다.' },
            kim: { name: '김혜수 이사', title: '히든', image: '/rescene/images/kim.jpg', description: '일에 있어서는 빈틈없고 철저한 일 처리 능력의 끝판왕이지만, 그 이면에는 멤버들을 향한 무한한 애정과 따뜻함을 품고 있습니다. 힘든 스케줄 속에서도 세심하게 아이들의 멘탈과 컨디션을 챙겨주어 멤버들이 친언니처럼 믿고 따르는 든든한 안식처입니다. 카리스마와 다정함이 완벽하게 공존하는 리센느의 든든한 조력자입니다.' },
            yoo: { name: '유영우', title: '작은삼촌', image: '/rescene/images/yoo.jpg', description: '이선민과 함께 \'나의 연수 아저씨\'에 출연해 리센느와 원이를 널리 알리는 데 큰 공헌을 한 핵심 인물입니다! 눈높이를 맞춰주는 편안한 \'작은 삼촌\'이자 사람 냄새가 물씬 풍기는 따뜻한 이미지의 소유자입니다. 코미디언임에도 불구하고 가수 뺨치는 엄청난 가창력을 뽐내며 여기저기 종횡무진 맹활약하고 있습니다.' },
            lee: { name: '이선민', title: '큰삼촌', image: '/rescene/images/lee.jpg', description: '유튜브 \'나의 연수 아저씨\'에서 원이와 환상의 케미를 뽐내며 리센느를 널리 알린 일등 공신입니다! 주저하지 않고 앞장서는 \'퍼스트 펭귄\'이자 듬직한 \'큰삼촌\'으로서 뛰어난 개그감과 든든함을 모두 보여주었습니다. 최근에는 여러 예능 프로그램을 종횡무진 누비며 대활약 중인 성공한 멋진 삼촌입니다.' }
        };

        let quizData = [
            {
                question: '리센느 멤버들의 성공을 위해서라면, 이 한몸 불태울 각오가 되어 있다?',
                answers: [
                    {
                        text: '당연하지! 기꺼이 내 모든 걸 불태울 수 있다 🔥',

                    {
                        text: '응원은 진심으로 하지만, 어느 정도 선은 지킨다 😌',

                ]
            },

                    {
                        text: '세상이 무너진다고?! 아악 어떡해!! 😭 (솔직하게 감정을 다 표출하며 티를 낸다)',
                        weights: { zena: 2, liv: 1, yoo: 1 }

                    {
                        text: '(동공지진) 하지만 겉으로는 평온... (최대한 꾹 참으며 덤덤한 척 한다)',

                    }
                ]
            },
            {
                question: '무대 위에 섰을 때, 내 목소리의 매력 포인트를 하나 꼽자면?',
                answers: [
                    {
                        text: '속이 뻥 뚫리는 시원한 성량! 나는 파워보컬 🎤',

                    },
                    {
                        text: '한 번 들으면 계속 생각나는 매력적인 음색 여신 🎧',

                    },
                    {
                        text: '(시무룩) 나도 웃기고 싶은데... 솔직히 노잼이라 가끔 슬프다... 🥲',
                        weights: { kim: 2, may: 1, zena: 1, kku: 1, yoo: 1 }
                    }
                ]
            },
            {
                question: '갑자기 휴가가 생겼다! 내가 가장 끌리는 여행지는?',
                answers: [
                    {

                        weights: { woni: 2 }
                    },
                    {
                        text: '왕갈비통닭과 화성의 도시, 경기도 수원 🏰',
                        weights: { liv: 2 }
                    },
                    {
                        text: '특유의 감성을 느낄 수 있는 일본 치바현 🌸',

                    },
                    {
                        text: '호수공원에서 즐기는 평화로운 여유, 일산 🌳',

                    },
                    {
                        text: '천년의 역사가 살아숨쉬는 신라의 달밤, 경주 🏯',

                    },
                    {
                        text: '어디든 상관없어! 누구랑 가느냐가 중요하지 🥰 (아무데나 다 좋아)',

                    }
                ]
            },
            {
                question: '무언가를 결정하거나 상황을 판단할 때, 나는 보통 어떤 쪽에 가까울까?',
                answers: [
                    {
                        text: '머리가 먼저 반응한다! 논리와 팩트를 중시하는 이성적인(T) 타입 💡',
                        weights: { kim: 2, may: 1, yoon: 1, kku: 1 }
                    },
                    {
                        text: '가슴이 먼저 반응한다! 공감과 감정을 중시하는 감성적인(F) 타입 💖',

        // 상태 변수
        let currentQuestionIndex = 0;
        let scores = {};

        // 화면 전환 함수
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // 유연한 점수판 초기화
        function initScores() {
            scores = {};
            for (const key in characters) {
                scores[key] = 0;
            }
        }

        // 테스트 시작
        function startTest() {
            if (quizData.length === 0) {
                alert("아직 등록된 질문이 없습니다! 질문을 추가해 주세요.");
                return;
            }
            initScores();
            currentQuestionIndex = 0;
            document.getElementById('total-q').innerText = quizData.length;
            renderQuestion();
            showScreen('screen-test');
        }

        // 질문 렌더링
        function renderQuestion() {
            const quiz = quizData[currentQuestionIndex];
            
            // 프로그레스 바 업데이트
            const progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = progressPercent + '%';
            document.getElementById('current-q').innerText = currentQuestionIndex + 1;

            // 질문 텍스트 업데이트
            document.getElementById('question-text').innerText = quiz.question;

            // 답변 버튼 생성
            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = ''; 

            quiz.answers.forEach(answer => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = answer.text;
                btn.onclick = () => handleAnswer(answer.weights);
                answersContainer.appendChild(btn);
            });
        }

        // 답변 클릭 처리
        function handleAnswer(weights) {
            if (weights) {
                for (const char in weights) {
                    if (scores[char] !== undefined) {
                        scores[char] += weights[char];
                    }
                }
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < quizData.length) {
                renderQuestion();
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                showLoading();
            }
        }

        // 로딩 화면 표시 및 결과 계산 대기
        function showLoading() {
            showScreen('screen-loading');
            
            setTimeout(() => {
                calculateResult();
                showScreen('screen-result');
            }, 2000);
        }

        // 최종 결과 도출
        function calculateResult() {
            let maxScore = -1;
            let finalCharacterKey = '';

            for (const key in characters) {
                if (scores[key] > maxScore) {
                    maxScore = scores[key];
                    finalCharacterKey = key;
                }
            }

            // 결과 화면 업데이트
            const resultChar = characters[finalCharacterKey];
            document.getElementById('result-title').innerText = resultChar.title;
            
            const imgEl = document.getElementById('result-image');
            if (resultChar.image && resultChar.image !== 'No image') {
                imgEl.src = resultChar.image;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            document.getElementById('result-name').innerText = resultChar.name;
            document.getElementById('result-desc').innerText = resultChar.description;
            
            // 상태 초기화 (광고 보이기, 해석 숨기기)
            document.getElementById('ad-container').style.display = 'block';
            document.getElementById('detailed-result').style.display = 'none';
        }


        function unlockResult() {
            document.getElementById('ad-container').style.display = 'none';
            document.getElementById('detailed-result').style.display = 'block';
            document.getElementById('detailed-result').style.animation = 'fadeIn 0.5s ease-in-out';
        }

        function shareResult() {
            const url = window.location.href.split('?')[0]; // Query string 제거
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    alert("테스트 주소가 복사되었습니다! 친구들에게 공유해보세요 💖");
                }).catch(err => {
                    alert("주소 복사에 실패했습니다. 브라우저 주소창을 복사해주세요.");
                });
            } else {
                alert("주소 복사가 지원되지 않는 브라우저입니다. 주소창을 복사해주세요.");
            }
        }

        function contactUs() {
            window.location.href = "mailto:admin@testyour.uk?subject=[리센느 테스트 문의]";
        }

        // 테스트 다시하기
        function restartTest() {
            showScreen('screen-start');
        }
    </script>
