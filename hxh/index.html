            },
            {
                question: '동료가 적에게 인질로 잡혔습니다. 적의 요구조건은 까다로운데...',
                choices: [
                    { text: '앞뒤 안 재고 당장 구하러 쳐들어간다. 동료가 먼저다!', scores: {gon: 3, leorio: 2} },
                    { text: '감정을 억누르고, 가장 안전하게 동료를 빼낼 전략을 짠다.', scores: {kurapika: 2, killua: 2} },
                    { text: '그 동료가 나에게 그만큼의 가치가 있는지 냉정하게 계산한다.', scores: {illumi: 3} },
                    { text: '적의 본거지를 통째로 장악해버리고 내 룰을 강요한다.', scores: {chrollo: 2, meruem: 2} }
                ]
            },
            {
                question: '당신이 가장 끌리는 직업/역할은?',
                choices: [
                    { text: '세상의 미지의 영역을 탐험하는 유적 헌터', scores: {gon: 3, kurapika: 1} },
                    { text: '돈을 많이 벌고 사람을 고치는 의사 (또는 전문직)', scores: {leorio: 3} },
                    { text: '규칙에 얽매이지 않고 내 맘대로 사는 암살자나 범죄자', scores: {killua: 1, illumi: 2, chrollo: 2} },
                    { text: '강한 자들을 찾아다니며 싸우는 전투광', scores: {hisoka: 3} }
                ]
            },
            {
                question: '수견식(넨 계통 판별)을 할 때 컵의 물이 어떻게 변하기를 바라나요?',
                choices: [
                    { text: '물이 확 넘쳐흐른다! (힘과 박력)', scores: {gon: 2} },
                    { text: '물의 맛이 변하거나 결정이 생긴다! (변화와 특수성)', scores: {killua: 2, hisoka: 1, kurapika: 1} },
                    { text: '나뭇잎이 내 마음대로 움직인다! (조작과 통제)', scores: {illumi: 2} },
                    { text: '전혀 예상치 못한 기이한 현상이 발생한다! (나만의 독창성)', scores: {chrollo: 2, meruem: 2} }
                ]
            },
            {
                question: '당신 인생의 궁극적인 목표는?',
                choices: [
                    { text: '나를 강하게 만들어줄 끝없는 모험과 새로운 만남', scores: {gon: 3} },
                    { text: '잃어버린 것을 되찾거나 신념을 지키는 것', scores: {kurapika: 3} },
                    { text: '돈, 지위, 친구 등 세속적이지만 따뜻한 행복', scores: {leorio: 3, killua: 1} },
                    { text: '세상의 정점에 서서 모든 것을 내 발아래 두는 것', scores: {meruem: 3, chrollo: 1} }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let scores = {};
        window.currentResultKey = '';

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startTest() {
            currentQuestionIndex = 0;
            scores = { gon: 0, killua: 0, kurapika: 0, leorio: 0, hisoka: 0, illumi: 0, chrollo: 0, meruem: 0 };
            
            for (let i = quizData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }
            quizData.forEach(q => {
                for (let i = q.choices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.choices[i], q.choices[j]] = [q.choices[j], q.choices[i]];
                }
            });

            renderQuestion();
            showScreen('screen-quiz');
        }

        function renderQuestion() {
            const data = quizData[currentQuestionIndex];
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('progress-bar').style.width = (currentQuestionIndex / quizData.length * 100) + '%';

            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            data.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice);
                container.appendChild(btn);
            });
        }

        function selectChoice(choice) {
            for (const [key, weight] of Object.entries(choice.scores)) {
                scores[key] += weight + (Math.random() * 0.1);
            }
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                renderQuestion();
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                showScreen('screen-loading');
                setTimeout(() => { calculateResult(); showScreen('screen-result'); }, 2000);
            }
        }

        function calculateResult() {
            let maxScore = -1, finalKey = '';
            for (const key in scores) {
                if (scores[key] > maxScore) { maxScore = scores[key]; finalKey = key; }
            }
            window.currentResultKey = finalKey;
            applyResultToUI(finalKey);
            document.getElementById('ad-container').style.display = 'block';
            document.getElementById('detailed-result').style.display = 'none';
        }
        
        function applyResultToUI(charKey) {
            const c = characters[charKey];
            document.getElementById('result-title').innerText = c.name;
            document.getElementById('result-image').src = c.image;
            document.getElementById('result-desc').innerHTML = c.description;
        }

        function unlockResult() {
            window.open('https://www.coupang.com', '_blank');
            document.getElementById('ad-container').style.display = 'none';
            document.getElementById('detailed-result').style.display = 'block';
            document.getElementById('detailed-result').style.animation = 'fadeIn 0.5s ease-in-out';
        }

        function shareResult() {
            const url = window.location.href.split('?')[0] + '?result=' + window.currentResultKey;
            const shareTitle = "나와 가장 닮은 헌터X헌터 캐릭터는?";
            const shareText = "헌터X헌터 캐릭터 성향 테스트!";
            if (navigator.share) {
                navigator.share({ title: shareTitle, text: shareText, url: url }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => alert("링크가 복사되었습니다!"));
            }
        }

        function contactUs() {
            window.location.href = "mailto:gbcnewskr@gmail.com?subject=[헌터X헌터 테스트 캐릭터 추가 요청]";
        }
        function restartTest() { showScreen('screen-start'); }

        window.addEventListener('DOMContentLoaded', () => {
            const p = new URLSearchParams(window.location.search).get('result');
            if (p && characters[p]) {
                window.currentResultKey = p;
                applyResultToUI(p);
                document.getElementById('ad-container').style.display = 'block';
                document.getElementById('detailed-result').style.display = 'none';
                document.querySelectorAll('.btn-outline').forEach(btn => btn.innerText = '나도 테스트 해보기');
                showScreen('screen-result');
            }
        });
    </script>
</body>
</html>
