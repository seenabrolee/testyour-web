<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTYOUR - 나를 알아보는 재미있는 테스트</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Jua', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        p.subtitle {
            color: #777;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .test-card {
            display: block;
            text-decoration: none;
            background: linear-gradient(135deg, #f3e5f5 0%, #fce4ec 100%);
            border-radius: 20px;
            padding: 30px 20px;
            color: #4a148c;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }

        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .test-card h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        .test-card p {
            margin: 0;
            color: #6a1b9a;
            font-size: 16px;
        }
        
        .footer {
            margin-top: auto;
            padding-top: 40px;
            color: #bbb;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>TESTYOUR</h1>
        <p class="subtitle">다양하고 재미있는 심리테스트 모음</p>
        
        <a href="/rescene" class="test-card">
            <h2>나와 가장 닮은 리센느 멤버는?</h2>
            <p>RE:MINE X RESCENE 성향 테스트 하러가기 🌸</p>
        </a>

        <!-- 나중에 추가될 테스트들을 위한 예시 공간 -->
        <!--
        <a href="/other-test" class="test-card" style="background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); color: #0d47a1;">
            <h2>다음 테스트 준비 중...</h2>
            <p>Comming Soon ✨</p>
        </a>
        -->

        <div class="footer">
            &copy; 2026 TESTYOUR. All rights reserved.
        </div>
    </div>
</body>
</html>
