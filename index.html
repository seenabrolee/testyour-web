    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        * {
            box-sizing: border-box;
            font-family: 'Jua', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;

            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);

            letter-spacing: 2px;
        }
        
        p.subtitle {
            color: #777;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .test-card {
            display: block;
            text-decoration: none;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }

        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .test-card h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        .test-card p {
            margin: 0;
            font-size: 16px;
        }
        
        .footer {
            margin-top: auto;
            padding-top: 40px;
            color: #bbb;
            font-size: 14px;
        }
