<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nen Affinity Assessment: Water Divination Test | TESTYOUR UK</title>
    
    <meta name="description" content="Discover your Hunter x Hunter Nen affinity through our interactive Water Divination test. Are you an Enhancer, Transmuter, Emitter, Conjurer, Manipulator, or Specialist?">
    <link rel="canonical" href="https://testyour.uk/en/nen/">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #0f1117;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background-color: #161a24;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            position: relative;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #262c3a;
        }
        .header-bar .logo {
            font-size: 20px;
            font-weight: 900;
            color: #ff3b30;
            text-decoration: none;
        }
        .lang-switch {
            font-size: 13px;
            background: rgba(255,255,255,0.08);
            padding: 4px 10px;
            border-radius: 15px;
        }
        .lang-switch a {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 600;
        }
        .lang-switch a.active { color: #ff3b30; }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 35px 20px;
            text-align: center;
            flex-grow: 1;
        }
        .screen.active { display: flex; }
        h1 {
            font-size: 26px;
            color: #ff3b30;
            margin-bottom: 8px;
            font-weight: 900;
        }
        .btn {
            background-color: #ff3b30;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
            width: 100%;
            max-width: 360px;
            text-decoration: none;
        }
        .btn:hover { background-color: #e0281e; transform: translateY(-2px); }
        .progress-container {
            width: 100%;
            background-color: #2d3748;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 35px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff3b30;
            transition: width 0.3s ease;
        }
        .question-text {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
            min-height: 60px;
            color: #f8fafc;
        }
        .choice-btn {
            background-color: #1e2433;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            width: 100%;
            font-size: 14.5px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.5;
        }
        .choice-btn:hover {
            background-color: #283347;
            border-color: #ff3b30;
            color: #fff;
            transform: translateY(-2px);
        }
        .hero-img {
            width: 100%;
            max-width: 280px;
            border-radius: 14px;
            margin: 15px 0 25px;
            border: 1px solid #334155;
        }
        .result-title {
            font-size: 24px;
            font-weight: 900;
            color: #ff3b30;
            margin-bottom: 8px;
        }
        .desc-box {
            background: #181d2a;
            border: 1px solid #283347;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            text-align: left;
            font-size: 14.5px;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
        .encyclopedia-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff3b30 0%, #c52218 100%);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <a href="/en/" class="logo">TESTYOUR</a>
            <div class="lang-switch">
                <a href="/nen/">KO</a>
                <span style="color:#475569;">|</span>
                <a href="/en/nen/" class="active">EN</a>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="screen-start" class="screen active">
            <div style="font-size: 13px; font-weight: bold; color: #ff3b30; letter-spacing: 2px; margin-bottom: 12px;">SHINGEN-RYU AURA TEST</div>
            <h1>What is Your Nen Type?</h1>
            <p style="color: #94a3b8; font-size: 15px; margin-bottom: 20px; line-height: 1.6;">
                Fill a glass of water, float a leaf upon it, and unleash your aura. Based on Hisoka's personality diagnosis, find your true Nen category.
            </p>
            <img src="/nen/images/divination_hero.jpg" alt="Water Divination" class="hero-img">
            <button class="btn" onclick="startTest()">Begin Water Divination &rarr;</button>
        </div>

        <!-- Question Screen -->
        <div id="screen-question" class="screen">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="question-text" class="question-text"></div>
            <div id="choices-container" style="width: 100%;"></div>
        </div>

        <!-- Result Screen -->
        <div id="screen-result" class="screen">
            <div style="font-size: 12px; font-weight: 700; color: #ff3b30; letter-spacing: 1.5px;">YOUR NEN AFFINITY</div>
            <img id="result-img" src="" alt="Nen Result" style="width:90px; height:90px; margin: 15px 0 10px;">
            <div id="result-title" class="result-title"></div>
            <div id="result-divination" style="font-size: 14px; color: #38bdf8; font-weight: 600; margin-bottom: 15px;"></div>

            <div id="result-desc" class="desc-box"></div>

            <a id="btn-dossier" href="#" class="encyclopedia-btn">📖 View Full Nen Encyclopedia Guide &rarr;</a>
            <button class="btn" style="background:#2d3748; color:#e2e8f0; margin-top:10px;" onclick="location.reload()">Retake Divination</button>
            <a href="/en/" style="color:#64748b; font-size:13px; text-decoration:none; margin-top:15px;">&larr; Back to Main Hub</a>
        </div>
    </div>

    <script>
        const nenProfiles = {
            enhancement: {
                name: "Enhancement (強化系)",
                divination: "Water volume increases and overflows the glass",
                img: "/nen/images/enhancement.svg",
                desc: "<strong>Personality:</strong> Simple, earnest, and determined.<br><strong>Combat Trait:</strong> Superhuman durability and direct melee supremacy.<br>Enhancers are honest, direct, and act on instinct. You prefer straightforward action over complicated schemes."
            },
            transmutation: {
                name: "Transmutation (変化系)",
                divination: "The taste of the water changes",
                img: "/nen/images/transmutation.svg",
                desc: "<strong>Personality:</strong> Whimsical, deceitful, and unpredictable.<br><strong>Combat Trait:</strong> Transforming aura into elements like electricity or rubber.<br>You are a charismatic trickster who masks deep loyalty beneath an unpredictable and witty exterior."
            },
            emission: {
                name: "Emission (放出系)",
                divination: "The color of the water changes",
                img: "/nen/images/emission.svg",
                desc: "<strong>Personality:</strong> Impatient, volatile, yet warm-hearted.<br><strong>Combat Trait:</strong> Long-range projectile firepower and teleportation.<br>Passionate and quick to react, you have an explosive temper but an intensely loyal heart."
            },
            conjuration: {
                name: "Conjuration (具現化系)",
                divination: "Impurities and crystals form in the water",
                img: "/nen/images/conjuration.svg",
                desc: "<strong>Personality:</strong> High-strung, fastidious, and stoic.<br><strong>Combat Trait:</strong> Creating physical weapons imbued with supernatural conditions.<br>You are meticulous and highly analytical, carefully analyzing risks before making a move."
            },
            manipulation: {
                name: "Manipulation (操作系)",
                divination: "The floating leaf moves across the surface",
                img: "/nen/images/manipulation.svg",
                desc: "<strong>Personality:</strong> Argumentative, logical, and protective.<br><strong>Combat Trait:</strong> Controlling living beings and inanimate tools with total command.<br>You value order, control, and logical justification above all else."
            },
            specialization: {
                name: "Specialization (特質系)",
                divination: "The leaf spins, shatters, or an unprecedented anomaly occurs",
                img: "/nen/images/specialization.svg",
                desc: "<strong>Personality:</strong> Individualistic, charismatic, and enigmatic.<br><strong>Combat Trait:</strong> Reality-breaking metaphysical powers (stealing skills, reading minds).<br>You march entirely to your own beat, commanding mysterious presence and profound inner independence."
            }
        };

        const questions = [
            {
                q: "When facing a seemingly insurmountable obstacle, your instinctive reaction is:",
                choices: [
                    { text: "Charge straight through it with maximum effort and raw determination.", type: "enhancement" },
                    { text: "Look for clever angles, loopholes, or unconventional shortcuts to slip past.", type: "transmutation" },
                    { text: "Blast through from a safe distance before it can touch you.", type: "emission" },
                    { text: "Carefully analyze its structural weaknesses and prepare specialized tools.", type: "conjuration" }
                ]
            },
            {
                q: "In social situations, how do people most commonly describe your presence?",
                choices: [
                    { text: "Honest, pure, and refreshingly straightforward.", type: "enhancement" },
                    { text: "Fascinating, witty, but delightfully unpredictable.", type: "transmutation" },
                    { text: "Expressive, energetic, and passionately outspoken.", type: "emission" },
                    { text: "Calm, mysterious, and marching to an entirely unique beat.", type: "specialization" }
                ]
            },
            {
                q: "When someone questions your methods in front of the group, you:",
                choices: [
                    { text: "Present a barrage of structured logical arguments and procedural points.", type: "manipulation" },
                    { text: "Stay calm and quiet on the surface, but note it meticulously for later.", type: "conjuration" },
                    { text: "Fire back instantly with passionate indignation.", type: "emission" },
                    { text: "Smile mischievously and change the subject to confuse them.", type: "transmutation" }
                ]
            },
            {
                q: "If you could manifest a supernatural power right now, which appeals most?",
                choices: [
                    { text: "Invulnerable physical armor and devastating strike power.", type: "enhancement" },
                    { text: "An aura that can turn into high-voltage lightning or razor-sharp thread.", type: "transmutation" },
                    { text: "The power to steal other people's abilities or rewrite the laws of reality.", type: "specialization" },
                    { text: "A physical item that enforces absolute rules on anyone caught in it.", type: "conjuration" }
                ]
            },
            {
                q: "What is your philosophy on life rules and social expectations?",
                choices: [
                    { text: "Rules keep chaos in check and must be respected logically.", type: "manipulation" },
                    { text: "Rules exist for other people; I follow my own personal destiny.", type: "specialization" },
                    { text: "If my heart tells me it is right, I will pursue it regardless of rules.", type: "enhancement" },
                    { text: "I adapt smoothly, following rules when convenient and dodging them when fun.", type: "transmutation" }
                ]
            }
        ];

        let currentQ = 0;
        let scores = { enhancement:0, transmutation:0, emission:0, conjuration:0, manipulation:0, specialization:0 };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startTest() {
            currentQ = 0;
            scores = { enhancement:0, transmutation:0, emission:0, conjuration:0, manipulation:0, specialization:0 };
            showScreen('screen-question');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQ];
            document.getElementById('question-text').innerText = (currentQ + 1) + ". " + q.q;
            document.getElementById('progress-bar').style.width = ((currentQ / questions.length) * 100) + '%';
            
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            q.choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = c.text;
                btn.onclick = () => {
                    scores[c.type]++;
                    currentQ++;
                    if (currentQ < questions.length) renderQuestion();
                    else showResults();
                };
                container.appendChild(btn);
            });
        }

        function showResults() {
            let maxScore = -1;
            let winner = 'enhancement';
            for (let t in scores) {
                if (scores[t] > maxScore) {
                    maxScore = scores[t];
                    winner = t;
                }
            }

            const p = nenProfiles[winner];
            document.getElementById('result-img').src = p.img;
            document.getElementById('result-title').innerText = p.name;
            document.getElementById('result-divination').innerText = "💧 " + p.divination;
            document.getElementById('result-desc').innerHTML = p.desc;
            document.getElementById('btn-dossier').href = '/en/nen/' + winner + '.html';

            showScreen('screen-result');
        }
    </script>
</body>
</html>
