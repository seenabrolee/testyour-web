<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f9d423" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#111118" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waterColorChange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb300" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ff5722" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b71c1c" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes rayPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.98); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @keyframes particleShoot {
        0% { transform: translateY(0); opacity: 0; }
        25% { opacity: 1; }
        100% { transform: translateY(-75px); opacity: 0; }
      }
      @keyframes leafFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .ray-effect { animation: rayPulse 2s ease-in-out infinite; transform-origin: 150px 170px; }
      .shoot-p1 { animation: particleShoot 2s ease-out infinite; }
      .shoot-p2 { animation: particleShoot 2.3s ease-out infinite 0.7s; }
      .floating-leaf { animation: leafFloat 2.8s ease-in-out infinite; transform-origin: 150px 115px; }
    </style>
  </defs>

  <!-- Background Aura -->
  <circle cx="150" cy="150" r="140" fill="#181822"/>
  <circle cx="150" cy="140" r="115" fill="url(#bgGlow)" filter="url(#goldGlow)"/>

  <!-- Radiating Color Rays -->
  <g class="ray-effect" filter="url(#goldGlow)">
    <polygon points="150,140 100,50 120,45" fill="#ffe082" opacity="0.3"/>
    <polygon points="150,140 180,45 200,50" fill="#ffe082" opacity="0.3"/>
    <polygon points="150,160 55,140 60,160" fill="#ffb74d" opacity="0.25"/>
    <polygon points="150,160 240,160 245,140" fill="#ffb74d" opacity="0.25"/>
  </g>

  <!-- Glass Shadow & Base -->
  <ellipse cx="150" cy="256" rx="60" ry="12" fill="#000000" opacity="0.5"/>

  <!-- Glass Water Body (Dramatically Changed into Radiant Ruby/Gold) -->
  <path d="M96 116 L105 240 Q106 248 116 248 L184 248 Q194 248 195 240 L204 116 Z" fill="url(#waterColorChange)" filter="url(#goldGlow)"/>

  <!-- Floating Energy Sparkles Shoot Up -->
  <g class="shoot-p1">
    <circle cx="135" cy="110" r="3" fill="#ffffff"/>
    <circle cx="165" cy="115" r="2.5" fill="#fff59d"/>
  </g>
  <g class="shoot-p2">
    <circle cx="150" cy="112" r="3.5" fill="#ffe082"/>
  </g>

  <!-- Water Surface (Glowing Golden) -->
  <ellipse cx="150" cy="116" rx="54" ry="11" fill="#ffca28" opacity="0.95"/>
  <ellipse cx="150" cy="115" rx="50" ry="8" fill="#fff9c4" opacity="0.8"/>

  <!-- Glass Outer Container -->
  <path d="M92 108 L104 242 Q105 250 116 250 L184 250 Q195 250 196 242 L208 108 Z" fill="url(#glassWall)" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
  <!-- Glass Rim -->
  <ellipse cx="150" cy="108" rx="58" ry="11" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75"/>
  <!-- Highlights -->
  <path d="M100 120 L108 238" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Floating Green Leaf In Radiant Water -->
  <g class="floating-leaf">
    <ellipse cx="150" cy="115" rx="30" ry="11" fill="#ffca28" opacity="0.5" filter="url(#goldGlow)"/>
    <path d="M125 115 C135 101, 168 103, 178 115 C168 129, 135 127, 125 115 Z" fill="#2eb85c" stroke="#1b6e36" stroke-width="1.2"/>
    <path d="M128 115 C138 105, 165 107, 175 115 C165 125, 138 123, 128 115 Z" fill="#4ade80"/>
    <path d="M124 115 Q150 115 178 115" stroke="#165b2d" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Tag / Label -->
  <g transform="translate(150, 282)">
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#f9a825" opacity="0.95"/>
    <text x="0" y="4" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">방출계 : 물의 색이 변한다!</text>
  </g>
</svg>