<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.2);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <circle cx="200" cy="160" r="80" fill="url(#glow)"/>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="60" text-anchor="middle" dominant-baseline="central" fill="white">🔥</text>
  <text x="200" y="280" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">방출계</text>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" text-anchor="middle">EMISSION</text>
  <rect x="0" y="0" width="400" height="400" rx="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
</svg>