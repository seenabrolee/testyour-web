<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff7e40" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#111118" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60c5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d74d4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes overflowWave {
        0%, 100% { transform: translateY(0) scaleY(1); }
        50% { transform: translateY(-3px) scaleY(1.05); }
      }
      @keyframes dropFall1 {
        0% { transform: translateY(0); opacity: 0; }
        30% { opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: translateY(85px); opacity: 0; }
      }
      @keyframes dropFall2 {
        0% { transform: translateY(0); opacity: 0; }
        25% { opacity: 1; }
        85% { opacity: 0.9; }
        100% { transform: translateY(95px); opacity: 0; }
      }
      @keyframes leafFloat {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-4px) rotate(3deg); }
      }
      @keyframes auraPulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      .wave-dome { animation: overflowWave 2.5s ease-in-out infinite; transform-origin: 150px 105px; }
      .falling-drop1 { animation: dropFall1 2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .falling-drop2 { animation: dropFall2 2.3s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.9s; }
      .floating-leaf { animation: leafFloat 3s ease-in-out infinite; transform-origin: 150px 102px; }
      .aura-glow { animation: auraPulse 2s ease-in-out infinite; transform-origin: 150px 150px; }
    </style>
  </defs>

  <!-- Background Aura -->
  <circle cx="150" cy="150" r="140" fill="#181822"/>
  <circle cx="150" cy="140" r="115" fill="url(#bgGlow)" class="aura-glow" filter="url(#auraGlow)"/>

  <!-- Overflowing aura rays -->
  <g stroke="#ff9d5c" stroke-width="2" opacity="0.4" stroke-dasharray="4 6" class="aura-glow">
    <line x1="150" y1="90" x2="150" y2="40"/>
    <line x1="110" y1="100" x2="80" y2="55"/>
    <line x1="190" y1="100" x2="220" y2="55"/>
    <line x1="80" y1="130" x2="45" y2="105"/>
    <line x1="220" y1="130" x2="255" y2="105"/>
  </g>

  <!-- Glass Shadow & Base -->
  <ellipse cx="150" cy="256" rx="60" ry="12" fill="#000000" opacity="0.5"/>
  
  <!-- Glass Water Body (Inside) -->
  <path d="M96 112 L105 240 Q106 248 116 248 L184 248 Q194 248 195 240 L204 112 Z" fill="url(#waterGrad)"/>
  
  <!-- Water Overflow Waves (Spilling out of the cup) -->
  <g class="wave-dome">
    <!-- Over-brimming water dome -->
    <path d="M90 108 C90 92, 210 92, 210 108 C210 116, 90 116, 90 108 Z" fill="#68d1ff" opacity="0.95" filter="url(#auraGlow)"/>
    <ellipse cx="150" cy="103" rx="58" ry="14" fill="#a6e5ff" opacity="0.7"/>
  </g>

  <!-- Cascading Water Streams Down Sides -->
  <path d="M91 108 Q86 130 92 165 Q95 180 94 210 Q93 235 98 248" fill="none" stroke="#72d5ff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M209 108 Q214 135 208 170 Q205 195 207 225 Q208 240 202 248" fill="none" stroke="#72d5ff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Falling Water Droplets -->
  <g class="falling-drop1">
    <ellipse cx="86" cy="140" rx="3.5" ry="5.5" fill="#c3eeff"/>
  </g>
  <g class="falling-drop2">
    <ellipse cx="215" cy="130" rx="4" ry="6" fill="#c3eeff"/>
  </g>

  <!-- Water puddles at bottom -->
  <ellipse cx="98" cy="252" rx="14" ry="4" fill="#68d1ff" opacity="0.6"/>
  <ellipse cx="204" cy="251" rx="16" ry="5" fill="#68d1ff" opacity="0.6"/>

  <!-- Glass Outer Container -->
  <path d="M92 108 L104 242 Q105 250 116 250 L184 250 Q195 250 196 242 L208 108 Z" fill="url(#glassWall)" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
  <!-- Glass Rim -->
  <ellipse cx="150" cy="108" rx="58" ry="11" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75"/>
  <!-- Highlights on Glass -->
  <path d="M100 120 L108 238" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M104 125 L111 225" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>

  <!-- Floating Green Leaf -->
  <g class="floating-leaf">
    <!-- Leaf Glow Aura -->
    <ellipse cx="150" cy="102" rx="30" ry="12" fill="#5aff89" opacity="0.4" filter="url(#auraGlow)"/>
    <!-- Leaf Body -->
    <path d="M125 102 C135 88, 168 90, 178 102 C168 116, 135 114, 125 102 Z" fill="#2eb85c" stroke="#1b6e36" stroke-width="1.2"/>
    <path d="M128 102 C138 92, 165 94, 175 102 C165 112, 138 110, 128 102 Z" fill="#4ade80"/>
    <!-- Stem and Veins -->
    <path d="M124 102 Q150 102 178 102" stroke="#165b2d" stroke-width="1.5" fill="none"/>
    <path d="M140 102 Q145 96 150 95" stroke="#165b2d" stroke-width="0.8" fill="none"/>
    <path d="M140 102 Q145 107 150 108" stroke="#165b2d" stroke-width="0.8" fill="none"/>
    <path d="M155 102 Q160 96 165 96" stroke="#165b2d" stroke-width="0.8" fill="none"/>
    <path d="M155 102 Q160 107 165 108" stroke="#165b2d" stroke-width="0.8" fill="none"/>
    <!-- Water droplet on leaf -->
    <circle cx="160" cy="99" r="2.2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Tag / Label -->
  <g transform="translate(150, 282)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#ff4b1f" opacity="0.95"/>
    <text x="0" y="4" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">강화계 : 물이 넘쳐흐른다!</text>
  </g>
</svg>