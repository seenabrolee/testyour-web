<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff4b1f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff9068" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Hexagon Background -->
  <polygon points="100,15 175,58 175,142 100,185 25,142 25,58" fill="url(#grad)" stroke="#ff4b1f" stroke-width="2" stroke-opacity="0.5"/>
  <polygon points="100,22 168,62 168,138 100,178 32,138 32,62" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
  
  <!-- Kanji -->
  <text x="100" y="125" font-family="'Malgun Gothic', 'Noto Serif CJK KR', 'Batang', serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">強</text>
  
  <!-- Subtitle -->
  <text x="100" y="160" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="0.9" text-anchor="middle" letter-spacing="2">강화계</text>
</svg>