<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#111118" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18ffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#006064" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes spinVortex {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes leafOrbit {
        0% { transform: rotate(0deg) translateX(18px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(18px) rotate(-360deg); }
      }
      .vortex-spin { animation: spinVortex 4s linear infinite; transform-origin: 150px 116px; }
      .orbit-leaf { animation: leafOrbit 4s linear infinite; transform-origin: 150px 116px; }
    </style>
  </defs>

  <!-- Background Aura -->
  <circle cx="150" cy="150" r="140" fill="#181822"/>
  <circle cx="150" cy="140" r="115" fill="url(#bgGlow)" filter="url(#cyanGlow)"/>

  <!-- Wind / Motion Swirls -->
  <g stroke="#84ffff" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="8 6" class="vortex-spin">
    <circle cx="150" cy="116" r="38"/>
    <circle cx="150" cy="116" r="24"/>
  </g>

  <!-- Glass Shadow & Base -->
  <ellipse cx="150" cy="256" rx="60" ry="12" fill="#000000" opacity="0.5"/>

  <!-- Glass Water Body -->
  <path d="M96 116 L105 240 Q106 248 116 248 L184 248 Q194 248 195 240 L204 116 Z" fill="url(#waterGrad)"/>

  <!-- Water Surface with Whirlpool Swirl -->
  <ellipse cx="150" cy="116" rx="54" ry="11" fill="#00b4d8" opacity="0.9"/>
  <g class="vortex-spin">
    <!-- Spiral Vortex Lines on Water -->
    <path d="M150 116 Q165 111 170 116 Q175 122 165 125 Q150 128 138 121 Q128 112 138 106 Q155 101 175 108" fill="none" stroke="#e0f7fa" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="150" cy="116" r="4" fill="#006064"/>
  </g>

  <!-- Glass Outer Container -->
  <path d="M92 108 L104 242 Q105 250 116 250 L184 250 Q195 250 196 242 L208 108 Z" fill="url(#glassWall)" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
  <!-- Glass Rim -->
  <ellipse cx="150" cy="108" rx="58" ry="11" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75"/>
  <!-- Glass Highlight -->
  <path d="M100 120 L108 238" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Leaf Actively Moving / Orbiting in the Whirlpool -->
  <g class="orbit-leaf">
    <!-- Trail behind leaf -->
    <ellipse cx="150" cy="116" rx="22" ry="8" fill="#18ffff" opacity="0.3" filter="url(#cyanGlow)"/>
    <path d="M136 116 C143 106, 163 107, 170 116 C163 125, 143 124, 136 116 Z" fill="#2eb85c" stroke="#1b6e36" stroke-width="1.2"/>
    <path d="M138 116 C144 109, 161 110, 168 116 C161 122, 144 121, 138 116 Z" fill="#4ade80"/>
    <path d="M135 116 Q152 116 170 116" stroke="#165b2d" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Tag / Label -->
  <g transform="translate(150, 282)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#00b4d8" opacity="0.95"/>
    <text x="0" y="4" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">조작계 : 나뭇잎이 스스로 회전한다!</text>
  </g>
</svg>