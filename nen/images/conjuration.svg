<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#111118" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69f0ae" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1b5e20" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes crystalShine {
        0%, 100% { opacity: 0.6; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes crystalFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      .c-shine { animation: crystalShine 2s ease-in-out infinite; transform-origin: center; }
      .c-float1 { animation: crystalFloat 2.6s ease-in-out infinite; }
      .c-float2 { animation: crystalFloat 3.2s ease-in-out infinite 0.8s; }
    </style>
  </defs>

  <!-- Background Aura -->
  <circle cx="150" cy="150" r="140" fill="#181822"/>
  <circle cx="150" cy="140" r="115" fill="url(#bgGlow)" filter="url(#emeraldGlow)"/>

  <!-- Glass Shadow & Base -->
  <ellipse cx="150" cy="256" rx="60" ry="12" fill="#000000" opacity="0.5"/>

  <!-- Glass Water Body -->
  <path d="M96 116 L105 240 Q106 248 116 248 L184 248 Q194 248 195 240 L204 116 Z" fill="url(#waterGrad)"/>

  <!-- Formed Crystals / Impurities inside Water -->
  <g class="c-float1">
    <!-- Big Emerald Crystal -->
    <polygon points="140,165 152,150 164,165 152,185" fill="#e8f5e9" stroke="#00e676" stroke-width="1.8" filter="url(#emeraldGlow)"/>
    <polygon points="140,165 152,150 152,185" fill="#a5d6a7" opacity="0.7"/>
  </g>
  <g class="c-float2">
    <!-- Smaller Diamond Crystal -->
    <polygon points="120,205 128,195 136,205 128,218" fill="#ffffff" stroke="#69f0ae" stroke-width="1.5"/>
    <!-- Crystal cluster right -->
    <polygon points="168,195 178,188 186,197 176,208" fill="#ffffff" stroke="#00e676" stroke-width="1.5"/>
  </g>
  <!-- Fine Sparkling Mineral Particles -->
  <circle cx="130" cy="145" r="2.5" fill="#b9f6ca" class="c-shine"/>
  <circle cx="170" cy="150" r="3" fill="#ffffff" class="c-shine" style="animation-delay: 0.5s;"/>
  <circle cx="155" cy="225" r="2" fill="#e8f5e9" class="c-shine" style="animation-delay: 1s;"/>

  <!-- Water Surface -->
  <ellipse cx="150" cy="116" rx="54" ry="11" fill="#a7f3d0" opacity="0.9"/>

  <!-- Glass Outer Container -->
  <path d="M92 108 L104 242 Q105 250 116 250 L184 250 Q195 250 196 242 L208 108 Z" fill="url(#glassWall)" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
  <!-- Glass Rim -->
  <ellipse cx="150" cy="108" rx="58" ry="11" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75"/>
  <!-- Glass Highlight -->
  <path d="M100 120 L108 238" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Floating Green Leaf with Crystalline Edges -->
  <g transform="translate(0, 0)">
    <path d="M125 115 C135 101, 168 103, 178 115 C168 129, 135 127, 125 115 Z" fill="#2eb85c" stroke="#1b6e36" stroke-width="1.2"/>
    <path d="M128 115 C138 105, 165 107, 175 115 C165 125, 138 123, 128 115 Z" fill="#4ade80"/>
    <path d="M124 115 Q150 115 178 115" stroke="#165b2d" stroke-width="1.5" fill="none"/>
    <!-- Crystal growing on the leaf tip -->
    <polygon points="175,114 184,111 182,117" fill="#ffffff" stroke="#00e676" stroke-width="0.8"/>
  </g>

  <!-- Tag / Label -->
  <g transform="translate(150, 282)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#059669" opacity="0.95"/>
    <text x="0" y="4" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">구현화계 : 결정/불순물이 생겨난다!</text>
  </g>
</svg>