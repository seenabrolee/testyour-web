                choices: [
                    { text: '논쟁을 좋아한다. 내 논리가 맞음을 증명하고 상대를 내 페이스로 끌어들인다.', scores: {manipulation: 4, emission: 1} },
                    { text: '독립적이고 과묵하지만, 묘한 카리스마가 있어 사람들이 내 의견을 따르게 된다.', scores: {specialization: 4, conjuration: 2} },
                    { text: '솔직하고 숨김이 없다. 거짓말을 잘 못하며 직설적으로 말한다.', scores: {enhancement: 3, emission: 2} },
                    { text: '진심을 숨기고 장난을 치거나, 상황에 따라 쉽게 태도를 바꾼다(변덕).', scores: {transmutation: 4, specialization: 1} }
                ]
            },
            {
                question: '나이와 경험이 쌓이면서 당신은 어떻게 변했다고 생각하나요?',
                choices: [
                    { text: '다혈질적인 성격을 억누를 수 있게 되었고, 말로 상대를 조종하는 법을 배웠다.', scores: {emission: 3, manipulation: 3} },
                    { text: '목표 자체는 단순하지만, 목표를 이루기 위해 욱하는 성질이나 조급함이 생겼다.', scores: {enhancement: 3, emission: 3} },
                    { text: '원래 변덕스럽고 장난기가 많았지만, 점차 진지하고 금욕적인(Stoic) 성격으로 굳어졌다.', scores: {transmutation: 3, conjuration: 3} },
                    { text: '내 독립적인 성향에 맞춰 리더십을 갖추거나, 주변을 완벽히 통제하는 능력이 생겼다.', scores: {specialization: 3, manipulation: 2, conjuration: 1} }
                ]
            },
            {
                question: '가장 마음에 드는 넨 능력의 형태는?',
                choices: [
                    { text: '단순무식! 오라를 몸에 둘러 공격력과 방어력을 극대화한다.', scores: {enhancement: 4} },
                    { text: '오라를 번개나 실 등 특수한 성질로 변화시켜 예측불허의 전투를 한다.', scores: {transmutation: 4} },
                    { text: '오라를 떨어뜨리거나 날려서 원거리에서 강력한 화력을 퍼붓는다.', scores: {emission: 4} },
                    { text: '쇠사슬이나 특수한 무기를 구체화하여, 제약과 서약으로 상대를 묶는다.', scores: {conjuration: 4} }
                ]
            },
            {
                question: '어떤 리더(혹은 강자)의 유형에 가장 이끌립니까?',
                choices: [
                    { text: '단순하고 순수하며, 끝없는 잠재력과 결단력을 보여주는 자 (예: 곤)', scores: {enhancement: 3, transmutation: 1} },
                    { text: '차갑고 예민하며, 자신을 희생해서라도 집단을 이끄는 리더 (예: 크라피카)', scores: {conjuration: 3, specialization: 2} },
                    { text: '압도적인 폭력과 이치로 상대를 지배하고 통제하는 카리스마 (예: 메르엠, 클로로)', scores: {specialization: 4, manipulation: 2} },
                    { text: '다혈질적이지만 논리와 말로 상대를 유도하며 판을 짜는 강자 (예: 네테로)', scores: {emission: 3, manipulation: 3} }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let scores = {};
        window.currentResultKey = '';

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startTest() {
            currentQuestionIndex = 0;
            scores = { enhancement: 0, transmutation: 0, emission: 0, conjuration: 0, manipulation: 0, specialization: 0 };
            
            for (let i = quizData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }
            quizData.forEach(q => {
                for (let i = q.choices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.choices[i], q.choices[j]] = [q.choices[j], q.choices[i]];
                }
            });

            renderQuestion();
            showScreen('screen-quiz');
        }

        function renderQuestion() {
            const data = quizData[currentQuestionIndex];
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('progress-bar').style.width = (currentQuestionIndex / quizData.length * 100) + '%';

            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            data.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice);
                container.appendChild(btn);
            });
        }

        function selectChoice(choice) {
            for (const [key, weight] of Object.entries(choice.scores)) {
                scores[key] += weight + (Math.random() * 0.1);
            }
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                renderQuestion();
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                showScreen('screen-loading');
                setTimeout(() => { calculateResult(); showScreen('screen-result'); }, 2500);
            }
        }

                const hexagonPos = {
            enhancement: 0,
            transmutation: 1,
            conjuration: 2,
            specialization: 3,
            manipulation: 4,
            emission: 5
        };

        function getSynergy(main, other) {
            if (main === other) return '100% (완벽)';
            const dist = Math.abs(hexagonPos[main] - hexagonPos[other]);
            const shortestDist = Math.min(dist, 6 - dist);
            if (shortestDist === 1) return '80% (훌륭한 시너지)';
            if (shortestDist === 2) return '60% (보통의 시너지)';
            return '0~40% (상극, 매우 나쁨)';
        }

        function calculateResult() {
            // Sort scores
            const sortedScores = Object.entries(scores)
                .sort((a, b) => b[1] - a[1]);
            
            const finalKey = sortedScores[0][0];
            const secondKey = sortedScores[1][0];
            const thirdKey = sortedScores[2][0];
            
            window.currentResultKey = finalKey;
            applyResultToUI(finalKey, secondKey, thirdKey);
            document.getElementById('ad-container').style.display = 'block';
            document.getElementById('detailed-result').style.display = 'none';
        }
        
        function applyResultToUI(nenKey, secondKey, thirdKey) {
            const n = nenTypes[nenKey];
            document.getElementById('result-title').innerText = n.name;
            document.getElementById('result-image').src = n.image;
            
            let desc = n.description;
            
            if (secondKey && thirdKey) {
                const s2 = nenTypes[secondKey];
                const s3 = nenTypes[thirdKey];
                desc += `<br><br><hr style="border:0; border-top:1px solid rgba(255,255,255,0.2); margin: 20px 0;">`;
                desc += `<strong>📊 내 안에 숨겨진 또 다른 계통</strong><br>`;
                desc += `당신의 응답을 분석한 결과, 아래 두 가지 계통의 성향도 강하게 나타납니다!<br><br>`;
                desc += `<strong>2순위: ${s2.name}</strong><br>`;
                desc += `• 나와의 궁합: <span style="color:#8b5cf6">${getSynergy(nenKey, secondKey)}</span><br><br>`;
                desc += `<strong>3순위: ${s3.name}</strong><br>`;
                desc += `• 나와의 궁합: <span style="color:#8b5cf6">${getSynergy(nenKey, thirdKey)}</span>`;
            }
            
            document.getElementById('result-desc').innerHTML = desc;
        }

        function unlockResult() {
            window.open('https://www.coupang.com', '_blank');
            document.getElementById('ad-container').style.display = 'none';
            document.getElementById('detailed-result').style.display = 'block';
            document.getElementById('detailed-result').style.animation = 'fadeIn 0.5s ease-in-out';
        }

        function shareResult() {
            const url = window.location.href.split('?')[0] + '?result=' + window.currentResultKey;
            const shareTitle = "나의 넨(念) 계통은?";
            const shareText = "수견식 테스트로 알아본 나의 넨 계통!";
            if (navigator.share) {
                navigator.share({ title: shareTitle, text: shareText, url: url }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => alert("링크가 복사되었습니다!"));
            }
        }

        function restartTest() { showScreen('screen-start'); }

                window.addEventListener('DOMContentLoaded', () => {
            const p = new URLSearchParams(window.location.search).get('result');
            if (p && nenTypes[p]) {
                window.currentResultKey = p;
                applyResultToUI(p, null, null);
                document.getElementById('ad-container').style.display = 'block';
                document.getElementById('detailed-result').style.display = 'none';
                document.querySelectorAll('.btn-outline').forEach(btn => btn.innerText = '나도 테스트 해보기');
                showScreen('screen-result');
            }
        });
    </script>
</body>
</html>
