    <style>

        body {

            border: none;
            padding: 15px 30px;

            font-weight: bold;

        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn-outline {
            background: transparent;

            color: #3b82f6;
            box-shadow: none;
        }
        .btn-outline:hover { background: #3b82f6; color: #fff; }

        .progress-container {
            width: 100%;
            background-color: #1f2937;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 40px;
            overflow: hidden;
            border: 1px solid #374151;
        }
        .progress-bar {

            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            width: 0%;

        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 40px;
            line-height: 1.5;
            min-height: 80px;
        }

            line-height: 1.4;

        }

        .result-image {
            width: 250px;

            margin-bottom: 20px;
            border: 3px solid #3b82f6;

        .result-title { font-size: 32px; color: #60a5fa; font-weight: 900; margin-bottom: 10px; }
        
        .result-desc {

            background-color: #1f2937;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #374151;
        }
        .result-desc strong { color: #60a5fa; }
        
        .ad-container {
            width: 100%;
            padding: 30px 20px;
            background-color: rgba(0,0,0,0.5);

            border-radius: 10px;

        .ad-container:hover { border-color: #3b82f6; background-color: rgba(37,99,235,0.1); }
        
        .loader {
            border: 5px solid #1f2937;
            border-top: 5px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .home-link {

            padding: 12px;

            border-radius: 8px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .home-link:hover { background-color: #374151; color: #fff; }

</head>

    <script>

                description: '<strong>📌 당신의 사내 포지션:</strong> 원칙주의 FM / 리더<br><br><strong>✨ 성격 분석:</strong><br>매뉴얼과 효율성을 가장 중시하는 철저한 원칙주의자입니다. 감정 기복이 적어 늘 냉철함을 유지하며, 군더더기 없이 합리적인 판단을 내립니다. 겉으로는 차갑고 엄격해 보이지만, 자신이 맡은 팀원들에 대한 책임감이 그 누구보다 강한 믿음직한 리더입니다.<br><br><strong>👍 환상의 짝꿍:</strong> 김솔음 (변칙적인 돌연변이)<br><strong>💬 자주 할 법한 말:</strong> "매뉴얼대로 행동하십시오."'

        const quizData = [

                ]

            {

                    { text: '90%. 완벽한 상황 통제와 매뉴얼 숙지로 위험을 피한다.', scores: {jaheon: 3} },
                    { text: '70%. 눈치 하나는 기가 막히게 빨라서 어떻게든 살아남는다.', scores: {haje: 3} },
                    { text: '50%. 남들 구하려다가 내가 죽을 위기에 처할 확률이 높다.', scores: {minsung: 3} }
                ]
            },
            {
                question: '동료들이 평가하는 나의 평소 이미지는?',
                choices: [
                    { text: '도무지 속을 알 수 없는 예측 불가능한 도른자', scores: {soleum: 3} },
                    { text: '찔러도 피 한 방울 안 나올 것 같은 무서운 FM 상사', scores: {jaheon: 3} },
                    { text: '말투는 틱틱대는데 일은 기가 막히게 잘하는 실무 에이스', scores: {haje: 3} },
                    { text: '항상 웃고 있고 에너지가 넘치는 인싸', scores: {minsung: 3} }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let scores = {};
        window.currentResultKey = '';

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startTest() {
            currentQuestionIndex = 0;
            scores = { soleum: 0, jaheon: 0, haje: 0, minsung: 0 };
            
            for (let i = quizData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }
            quizData.forEach(q => {
                for (let i = q.choices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.choices[i], q.choices[j]] = [q.choices[j], q.choices[i]];
                }
            });

            renderQuestion();
            showScreen('screen-quiz');
        }

        function renderQuestion() {
            const data = quizData[currentQuestionIndex];
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('progress-bar').style.width = (currentQuestionIndex / quizData.length * 100) + '%';

            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            data.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice);
                container.appendChild(btn);
            });
        }

        function selectChoice(choice) {
            for (const [key, weight] of Object.entries(choice.scores)) {
                scores[key] += weight + (Math.random() * 0.1);
            }
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                renderQuestion();
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                showScreen('screen-loading');
                setTimeout(() => { calculateResult(); showScreen('screen-result'); }, 2500);
            }
        }

        function calculateResult() {
            let maxScore = -1, finalKey = '';
            for (const key in scores) {
                if (scores[key] > maxScore) { maxScore = scores[key]; finalKey = key; }
            }
            window.currentResultKey = finalKey;
            applyResultToUI(finalKey);
            document.getElementById('ad-container').style.display = 'block';
            document.getElementById('detailed-result').style.display = 'none';
        }
        
        function applyResultToUI(charKey) {
            const c = characters[charKey];
            document.getElementById('result-title').innerText = c.name;
            document.getElementById('result-image').src = c.image;
            document.getElementById('result-desc').innerHTML = c.description;
        }

        function unlockResult() {
            window.open('https://www.coupang.com', '_blank');
            document.getElementById('ad-container').style.display = 'none';
            document.getElementById('detailed-result').style.display = 'block';
            document.getElementById('detailed-result').style.animation = 'fadeIn 0.5s ease-in-out';
        }

        function shareResult() {
            const url = window.location.href.split('?')[0] + '?result=' + window.currentResultKey;
            const shareTitle = "백일몽 주식회사 입사 테스트";
            const shareText = "나는 괴담출근 현장탐사팀의 누구일까?";
            if (navigator.share) {
                navigator.share({ title: shareTitle, text: shareText, url: url }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => alert("링크가 복사되었습니다!"));
            }
        }

        function restartTest() { showScreen('screen-start'); }

        window.addEventListener('DOMContentLoaded', () => {
            const p = new URLSearchParams(window.location.search).get('result');
            if (p && characters[p]) {
                window.currentResultKey = p;
                applyResultToUI(p);
                document.getElementById('ad-container').style.display = 'block';
                document.getElementById('detailed-result').style.display = 'none';
                document.querySelectorAll('.btn-outline').forEach(btn => btn.innerText = '나도 테스트 해보기');
                showScreen('screen-result');
            }
        });
    </script>
</body>
</html>
