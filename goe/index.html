                    { text: '빠르게 계산기를 두드려 상황을 역전시킬 묘수를 짠다.', scores: {soleum: 3} },
                    { text: '냉정하게 실수의 원인을 분석하고, 책임 소재를 명확히 한다.', scores: {jaheon: 3, seokju: 2} },
                    { text: '"누구나 실수할 수 있죠!" 다독여주고 멘탈부터 챙겨준다.', scores: {minsung: 3, sunghae: 1} },
                    { text: '내 알 바 아니다. 내 생존과 이익에 방해되면 꼬리를 자른다.', scores: {saheon: 3} }
                ]
            },
            {
                question: '처음 보는 사람이 나에게 친한 척하며 다가올 때',
                choices: [
                    { text: '속으로는 철저히 경계하면서 겉으로는 순박하고 만만한 척 연기한다.', scores: {saheon: 3, soleum: 1} },
                    { text: '딱 업무적이고 예의 바른 태도만 보여주며 선을 긋는다.', scores: {jaheon: 3, seokju: 1} },
                    { text: '"뭐야 이 사람은?" 귀찮아하며 대충 철벽을 친다.', scores: {haje: 3} },
                    { text: '"착한 분인가여?" 관찰하다가 선한 사람이면 환영한다.', scores: {sunghae: 3, minsung: 2} }
                ]
            },
            {
                question: '후배가 나에게 업무 질문을 하러 왔다.',
                choices: [
                    { text: '"이것도 몰라?" 틱틱대면서도 처음부터 끝까지 다 해준다.', scores: {haje: 3} },
                    { text: '친절하게 웃으며 하나하나 세심하게 알려준다.', scores: {minsung: 3} },
                    { text: '"매뉴얼 3장 4절을 읽어보십시오." 정석대로 지도한다.', scores: {jaheon: 3} },
                    { text: '"요즘 애들은 끈기가 없어!" 한바탕 훈계부터 시작한다.', scores: {seokju: 3} }
                ]
            },
            {
                question: '업무 스트레스가 극에 달했을 때 푸는 방식은?',
                choices: [
                    { text: '아무도 없는 곳에서 조용히 내적 비명(?)을 지른다.', scores: {soleum: 3} },
                    { text: '사람들을 만나 땀을 빼거나 수다를 떨며 긍정 에너지로 푼다.', scores: {minsung: 3} },
                    { text: '내가 더 올라가서 다 밟아버리겠다는 독기를 품으며 버틴다.', scores: {saheon: 3, seokju: 1} },
                    { text: '평소 관심 있던 괴담이나 기괴한 연구에 더욱 몰두한다.', scores: {jegang: 3} }
                ]
            },
            {
                question: '나의 진정한 내면(본성)에 가까운 것은?',
                choices: [
                    { text: '불만은 많지만 결정적인 순간엔 남을 버리지 못하는 정 많은 사람', scores: {haje: 3, minsung: 1} },
                    { text: '내가 최고가 되어야 하고, 무질서와 하극상을 참을 수 없는 꼰대 엘리트', scores: {seokju: 3, saheon: 1} },
                    { text: '악인에게는 가차 없고 선한 사람에게는 무한히 관대한 정의파', scores: {sunghae: 3} },
                    { text: '호기심을 위해서라면 내 목숨도 베팅할 수 있는 광기의 탐구자', scores: {jegang: 3} }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let scores = {};
        window.currentResultKey = '';

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startTest() {
            currentQuestionIndex = 0;
            scores = { soleum: 0, jaheon: 0, haje: 0, minsung: 0, seokju: 0, saheon: 0, sunghae: 0, jegang: 0 };
            
            for (let i = quizData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
            }
            quizData.forEach(q => {
                for (let i = q.choices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.choices[i], q.choices[j]] = [q.choices[j], q.choices[i]];
                }
            });

            renderQuestion();
            showScreen('screen-quiz');
        }

        function renderQuestion() {
            const data = quizData[currentQuestionIndex];
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('progress-bar').style.width = (currentQuestionIndex / quizData.length * 100) + '%';

            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            data.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice);
                container.appendChild(btn);
            });
        }

        function selectChoice(choice) {
            for (const [key, weight] of Object.entries(choice.scores)) {
                scores[key] += weight + (Math.random() * 0.1);
            }
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                renderQuestion();
            } else {
                document.getElementById('progress-bar').style.width = '100%';
                showScreen('screen-loading');
                setTimeout(() => { calculateResult(); showScreen('screen-result'); }, 2500);
            }
        }

        function calculateResult() {
            let maxScore = -1, finalKey = '';
            for (const key in scores) {
                if (scores[key] > maxScore) { maxScore = scores[key]; finalKey = key; }
            }
            window.currentResultKey = finalKey;
            applyResultToUI(finalKey);
            document.getElementById('ad-container').style.display = 'block';
            document.getElementById('detailed-result').style.display = 'none';
        }
        
        function applyResultToUI(charKey) {
            const c = characters[charKey];
            document.getElementById('result-title').innerText = c.name;
            document.getElementById('result-image').src = c.image;
            document.getElementById('result-desc').innerHTML = c.description;
        }

        function unlockResult() {
            window.open('https://www.coupang.com', '_blank');
            document.getElementById('ad-container').style.display = 'none';
            document.getElementById('detailed-result').style.display = 'block';
            document.getElementById('detailed-result').style.animation = 'fadeIn 0.5s ease-in-out';
        }

        function shareResult() {
            const url = window.location.href.split('?')[0] + '?result=' + window.currentResultKey;
            const shareTitle = "백일몽 주식회사 입사 테스트";
            const shareText = "나는 괴담출근 현장탐사팀의 누구일까?";
            if (navigator.share) {
                navigator.share({ title: shareTitle, text: shareText, url: url }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => alert("링크가 복사되었습니다!"));
            }
        }

        function restartTest() { showScreen('screen-start'); }

        window.addEventListener('DOMContentLoaded', () => {
            const p = new URLSearchParams(window.location.search).get('result');
            if (p && characters[p]) {
                window.currentResultKey = p;
                applyResultToUI(p);
                document.getElementById('ad-container').style.display = 'block';
                document.getElementById('detailed-result').style.display = 'none';
                document.querySelectorAll('.btn-outline').forEach(btn => btn.innerText = '나도 테스트 해보기');
                showScreen('screen-result');
            }
        });
    </script>
</body>
</html>
